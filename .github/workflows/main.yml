name: Free YouTube Automation

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic"
        required: true
        default: "5 amazing facts about space"

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng jq curl

      - name: Generate AI script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ inputs.topic }}
        run: |
          set -e

          PROMPT="Write a short YouTube Shorts narration about: ${TOPIC}

          Requirements:
          - 120 to 150 words
          - Hindi language
          - Start with a strong hook
          - Simple spoken Hindi
          - No markdown
          - No title
          - No emojis
          - End with a short call to action."

          RESPONSE=$(jq -n \
            --arg prompt "$PROMPT" \
            '{
              contents: [
                {
                  parts: [
                    {
                      text: $prompt
                    }
                  ]
                }
              ]
            }')

          RESULT=$(curl -sS \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$RESPONSE")

          echo "$RESULT" | jq .

          SCRIPT=$(echo "$RESULT" | jq -r \
            '.candidates[0].content.parts[0].text // empty')

          if [ -z "$SCRIPT" ]; then
            echo "AI script generation failed."
            exit 1
          fi

          echo "$SCRIPT" > script.txt

          echo "Generated script:"
          cat script.txt

      - name: Create voice
        run: |
          set -e

          espeak-ng \
            -v hi \
            -s 145 \
            -p 45 \
            -a 150 \
            -f script.txt \
            -w voice.wav

          ls -lh voice.wav

      - name: Create video background
        run: |
          set -e

          DURATION=$(ff
