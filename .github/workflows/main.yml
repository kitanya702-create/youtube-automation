name: Generate Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-venv

          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install google-genai edge-tts

          echo "FFmpeg installed successfully."
          ffmpeg -version | head -1

      - name: Generate AI script (100% Free Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY secret nahi mila. Settings -> Secrets me add karein."
            exit 1
          fi

          .venv/bin/python <<'PY'
          import os
          from google import genai

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          prompt = (
              "You write short, engaging Hindi scripts for YouTube Shorts. "
              "Write a 30 to 40-second engaging Hindi script with a strong hook at the start and a memorable ending. "
              "Return only the spoken Hindi voice-over text in Devanagari script. "
              "Do not include headings, scene descriptions, sound effects, markdown asterisks, or emojis."
          )

          response = client.models.generate_content(
              model="gemini-3.0-flash",
              contents=prompt,
          )

          script = response.text.strip()

          if not script:
              raise RuntimeError("Gemini ne khali script di.")

          with open("script.txt", "w", encoding="utf-8") as f:
              f.write(script)

          print("===== GENERATED SCRIPT =====")
          print(script)
          print("============================")
          PY

      - name: Create Hindi Voice (Edge-TTS)
        run: |
          set -e

          .venv/bin/edge-tts \
            --voice "hi-IN-MadhurNeural" \
            --file script.txt \
            --write-media voice.mp3

          test -s voice.mp3
          echo "Voice created successfully."
          ls -lh voice.mp3

      - name: Create Video Background
        run: |
          set -e

          DURATION=$(
            ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              voice.mp3
          )

          echo "Audio duration: ${DURATION} seconds"

          # 1080x1920 vertical black background with audio
          ffmpeg -y \
            -f lavfi \
            -i "color=c=black:s=1080x1920:r=30:d=${DURATION}" \
            -i voice.mp3 \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -shortest \
            -movflags +faststart \
            video.mp4

          test -s video.mp4
          echo "Video created successfully."
          ls -lh video.mp4

      - name: Upload Generated Files
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: |
            script.txt
            voice.mp3
            video.mp4
            
