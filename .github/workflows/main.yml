name: Generate Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-venv

          python3 -m venv .venv

          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install openai edge-tts

          echo "FFmpeg installed:"
          ffmpeg -version | head -1

      - name: Generate AI script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e

          if [ -z "$OPENAI_API_KEY" ]; then
            echo "ERROR: OPENAI_API_KEY secret नहीं मिला."
            exit 1
          fi

          .venv/bin/python <<'PY'
          import os
          from openai import OpenAI

          client = OpenAI(
              api_key=os.environ["OPENAI_API_KEY"]
          )

          response = client.responses.create(
              model="gpt-5.5",
              instructions=(
                  "You write short, engaging Hindi scripts for YouTube Shorts. "
                  "Return only the Hindi voice-over script. "
                  "Do not add headings, markdown, emojis or explanations."
              ),
              input=(
                  "एक engaging Hindi YouTube Shorts script लिखो। "
                  "लगभग 30 से 45 सेकंड की हो। "
                  "शुरुआत में strong hook हो और अंत में memorable line हो।"
              )
          )

          script = response.output_text.strip()

          if not script:
              raise RuntimeError("OpenAI ने खाली script दी.")

          with open("script.txt", "w", encoding="utf-8") as f:
              f.write(script)

          print("===== GENERATED SCRIPT =====")
          print(script)
          print("============================")
          PY

      - name: Create Hindi Voice
        run: |
          set -e

          .venv/bin/edge-tts \
            --voice "hi-IN-MadhurNeural" \
            --file script.txt \
            --write-media voice.mp3

          test -s voice.mp3

          echo "Voice created successfully."
          ls -lh voice.mp3

      - name: Create Video Background
        run: |
          set -e

          DURATION=$(
            ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              voice.mp3
          )

          echo "Audio duration: ${DURATION} seconds"

          ffmpeg -y \
            -f lavfi \
            -i "color=c=black:s=1080x1920:r=30:d=${DURATION}" \
            -i voice.mp3 \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -shortest \
            -movflags +faststart \
            video.mp4

          test -s video.mp4

          echo "Video created successfully."
          ls -lh video.mp4

      - name: Upload Generated Files
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: |
            script.txt
            voice.mp3
            video.mp4
