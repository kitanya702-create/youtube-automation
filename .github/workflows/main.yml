name: YouTube Video Automation

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Video prompt"
        required: true
        default: "A cinematic futuristic city at night, neon lights, flying cars, realistic camera movement, dramatic atmosphere"

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Generate Veo video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_PROMPT: ${{ inputs.prompt }}
        run: |
          set -e

          BASE_URL="https://generativelanguage.googleapis.com/v1beta"

          echo "Starting Veo 3.1 generation..."

          RESPONSE=$(curl -sS \
            -X POST \
            "${BASE_URL}/models/veo-3.1-generate-preview:predictLongRunning" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg prompt "$VIDEO_PROMPT" \
              '{
                instances: [
                  {
                    prompt: $prompt
                  }
                ],
                parameters: {
                  aspectRatio: "9:16",
                  resolution: "720p"
                }
              }'
            )")

          echo "API response:"
          echo "$RESPONSE" | jq .

          OPERATION_NAME=$(echo "$RESPONSE" | jq -r '.name // empty')

          if [ -z "$OPERATION_NAME" ]; then
            echo "ERROR: Veo operation was not created."
            exit 1
          fi

          echo "Operation: $OPERATION_NAME"

          echo "Waiting for video..."

          for i in {1..60}; do

            sleep 10

            STATUS=$(curl -sS \
              -H "x-goog-api-key: ${GEMINI_API_KEY}" \
              "${BASE_URL}/${OPERATION_NAME}")

            DONE=$(echo "$STATUS" | jq -r '.done // false')

            echo "Check $i/60 - done=$DONE"

            if [ "$DONE" = "true" ]; then

              ERROR=$(echo "$STATUS" | jq -r '.error.message // empty')

              if [ -n "$ERROR" ]; then
                echo "Veo generation failed:"
                echo "$ERROR"
                exit 1
              fi

              VIDEO_URI=$(echo "$STATUS" | jq -r \
                '.response.generateVideoResponse.generatedSamples[0].video.uri // empty')

              if [ -z "$VIDEO_URI" ]; then
                echo "ERROR: Video URI not found."
                echo "$STATUS" | jq .
                exit 1
              fi

              echo "Video generated successfully."

              curl -L \
                -H "x-goog-api-key: ${GEMINI_API_KEY}" \
                "$VIDEO_URI" \
                -o youtube-video.mp4

              break
            fi

            if [ "$i" = "60" ]; then
              echo "ERROR: Video generation timed out."
              exit 1
            fi

          done

      - name: Check generated video
        run: |
          ls -lh youtube-video.mp4
          file youtube-video.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v7
        with:
          name: youtube-video
          path: youtube-video.mp4
          if-no-files-found: error
          retention-days: 7
