name: YouTube Automation

on:
  workflow_dispatch:

jobs:
  generate-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts requests

      - name: Generate AI Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > generate_ai.py <<'PY'
          import os
          import time
          import requests

          api_key = os.environ.get("GEMINI_API_KEY")

          if not api_key:
              raise Exception("GEMINI_API_KEY secret is missing.")

          prompt = """Create a 45 to 60 second YouTube Shorts script in Hindi.

          Topic: Interesting facts about space.

          Rules:
          - Start with a strong hook.
          - Use simple Hindi.
          - Make it interesting and engaging.
          - No headings.
          - No emojis.
          - End with a short call to action.
          """

          models = [
              "gemini-3.7-flash",
              "gemini-3.6-flash"
          ]

          script = None

          for model in models:
              print("Trying model:", model)

              for attempt in range(5):
                  print("Attempt:", attempt + 1)

                  url = (
                      "https://generativelanguage.googleapis.com/v1beta/"
                      + "models/"
                      + model
                      + ":generateContent?key="
                      + api_key
                  )

                  payload = {
                      "contents": [
                          {
                              "parts": [
                                  {
                                      "text": prompt
                                  }
                              ]
                          }
                      ]
                  }

                  try:
                      response = requests.post(
                          url,
                          json=payload,
                          timeout=60
                      )

                      print("HTTP Status:", response.status_code)

                      if response.status_code == 200:
                          data = response.json()
                          script = data["candidates"][0]["content"]["parts"][0]["text"]
                          print("SUCCESS!")
                          break

                      print("API error. Retrying...")
                      time.sleep(10)

                  except Exception as error:
                      print("Request error:", error)
                      time.sleep(10)

              if script:
                  break

          if not script:
              raise Exception("AI script generation failed.")

          with open("script.txt", "w", encoding="utf-8") as file:
              file.write(script)

          print("Script saved successfully.")
          print(script)
          PY

          python generate_ai.py

      - name: Generate Hindi Voice
        run: |
          cat > generate_voice.py <<'PY'
          import asyncio
          import edge_tts

          async def main():
              with open("script.txt", "r", encoding="utf-8") as file:
                  text = file.read()

              communicator = edge_tts.Communicate(
                  text,
                  "hi-IN-MadhurNeural"
              )

              await communicator.save("voice.mp3")

              print("Hindi voice generated successfully.")

          asyncio.run(main())
          PY

          python generate_voice.py

      - name: Save Files
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video-assets
          path: |
            script.txt
            voice.mp3

      - name: Complete
        run: |
          echo "YouTube automation completed successfully!"
          echo "Script and voice files are ready."
