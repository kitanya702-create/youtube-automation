name: Generate Video

on:
  workflow_dispatch:

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-pip
          python3 -m pip install --upgrade pip --break-system-packages
          python3 -m pip install edge-tts --break-system-packages

          echo "FFmpeg:"
          ffmpeg -version | head -1

          echo "TTS:"
          python3 -m edge_tts --help

      - name: Generate AI script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e

          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret नहीं मिला"
            exit 1
          fi

          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          api_key = os.environ["OPENAI_API_KEY"]

          payload = {
              "model": "gpt-5.6",
              "input": "हिंदी में 30 सेकंड के वीडियो के लिए एक engaging voice-over script लिखो। केवल script दो।"
          }

          req = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {api_key}"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=120) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print(e.read().decode("utf-8"))
              raise

          script = result.get("output_text", "").strip()

          if not script:
              print(json.dumps(result, ensure_ascii=False, indent=2))
              raise RuntimeError("AI ने script नहीं दी")

          with open("script.txt", "w", encoding="utf-8") as f:
              f.write(script)

          print("===== SCRIPT =====")
          print(script)
          print("==================")
          PY

      - name: Create Hindi Voice
        run: |
          python3 -m edge_tts \
            --text "$(cat script.txt)" \
            --voice "hi-IN-MadhurNeural" \
            --write-media voice.mp3

      - name: Check Output
        run: |
          ls -lh script.txt voice.mp3

      - name: Upload Video Files
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-files
          path: |
            script.txt
            voice.mp3
