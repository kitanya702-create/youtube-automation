- name: Generate AI script
  env:
    OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  run: |
    set -e

    echo "Generating AI script..."

    python3 - <<'PY'
    import os
    import json
    import urllib.request
    import urllib.error

    api_key = os.environ.get("OPENAI_API_KEY")

    if not api_key:
        raise SystemExit("OPENAI_API_KEY नहीं मिली")

    payload = {
        "model": "gpt-5.6",
        "input": "हिंदी में एक छोटा, engaging और natural video voice-over script लिखो। केवल script दो, कोई heading या explanation नहीं।"
    }

    request = urllib.request.Request(
        "https://api.openai.com/v1/responses",
        data=json.dumps(payload).encode("utf-8"),
        headers={
            "Content-Type": "application/json",
            "Authorization": "Bearer " + api_key
        },
        method="POST"
    )

    try:
        with urllib.request.urlopen(request, timeout=120) as response:
            result = json.loads(response.read().decode("utf-8"))
    except urllib.error.HTTPError as e:
        error = e.read().decode("utf-8")
        print("OpenAI API Error:")
        print(error)
        raise SystemExit(1)

    script = result.get("output_text", "").strip()

    if not script:
        print(json.dumps(result, ensure_ascii=False, indent=2))
        raise SystemExit("AI script generate नहीं हुई")

    print("Script generated successfully.")

    with open("script.txt", "w", encoding="utf-8") as f:
        f.write(script)

    print(script)
    PY

    echo "AI script saved to script.txt"
