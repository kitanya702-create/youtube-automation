name: Generate Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-venv

          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install groq edge-tts

          echo "FFmpeg installed successfully."
          ffmpeg -version | head -1

      - name: Generate AI script (Free Groq Llama 3)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -e

          if [ -z "$GROQ_API_KEY" ]; then
            echo "ERROR: GROQ_API_KEY secret nahi mila. GitHub Settings me add karein."
            exit 1
          fi

          .venv/bin/python <<'PY'
          import os
          from groq import Groq

          client = Groq(api_key=os.environ["GROQ_API_KEY"])

          prompt = (
              "Write a short, engaging 30-40 second Hindi script for YouTube Shorts. "
              "Topic: An interesting motivational or mind-blowing psychology fact. "
              "Output ONLY the Hindi speech text in Devanagari script. "
              "Do not include English, markdown, emojis, scene notes, or titles. Just pure spoken words."
          )

          chat_completion = client.chat.completions.create(
              messages=[
                  {
                      "role": "user",
                      "content": prompt,
                  }
              ],
              model="llama-3.3-70b-versatile",
          )

          script = chat_completion.choices[0].message.content.strip()

          if not script:
              raise RuntimeError("Script generate nahi hui.")

          with open("script.txt", "w", encoding="utf-8") as f:
              f.write(script)

          print("===== GENERATED SCRIPT =====")
          print(script)
          print("============================")
          PY

      - name: Create Hindi Voice (Edge-TTS)
        run: |
          set -e

          .venv/bin/edge-tts \
            --voice "hi-IN-MadhurNeural" \
            --file script.txt \
            --write-media voice.mp3

          test -s voice.mp3
          echo "Voice created successfully."
          ls -lh voice.mp3

      - name: Create Video Background
        run: |
          set -e

          DURATION=$(
            ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              voice.mp3
          )

          echo "Audio duration: ${DURATION} seconds"

          # 1080x1920 vertical black background with audio
          ffmpeg -y \
            -f lavfi \
            -i "color=c=black:s=1080x1920:r=30:d=${DURATION}" \
            -i voice.mp3 \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -shortest \
            -movflags +faststart \
            video.mp4

          test -s video.mp4
          echo "Video created successfully."
          ls -lh video.mp4

      - name: Upload Generated Files
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: |
            script.txt
            voice.mp3
            video.mp4
            
