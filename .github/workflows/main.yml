name: YouTube Automation

on:
  workflow_dispatch:

jobs:
  generate-script:
    runs-on: ubuntu-latest

    steps:
      - name: Generate AI Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for attempt in 1 2 3 4 5
          do
            echo "Attempt $attempt..."

            HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent" \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              -d '{
                "contents": [{
                  "parts": [{
                    "text": "Write a short, exciting Hindi YouTube video script about an interesting mystery. Give only the script."
                  }]
                }]
              }')

            echo "HTTP Status: $HTTP_CODE"
            cat response.json

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "SUCCESS!"
              break
            fi

            if [ "$HTTP_CODE" -eq 503 ] || [ "$HTTP_CODE" -eq 429 ] || [ "$HTTP_CODE" -ge 500 ]; then
              WAIT=$((attempt * 10))
              echo "Temporary error. Waiting ${WAIT} seconds..."
              sleep $WAIT
            else
              echo "Non-retryable error."
              exit 1
            fi
          done

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Gemini request failed after 5 attempts."
            exit 1
          fi
